let toastTimer;function toast(msg){clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),2400)}
function go(hash){location.hash=hash}function shell(content,active='Overview'){const nav=[['#dashboard','Overview'],['#dashboard/jobs','Jobs'],['#dashboard/technicians','Technicians'],['#dashboard/customers','Customers'],['#dashboard/quotes','Quotes'],['#dashboard/payments','Payments & invoices'],['#dashboard/analytics','Analytics']];return `<div class="shell"><aside class="side"><a class="brand" href="#"><span class="brand-mark">➤</span><span><strong>GULF TECH SERVICES</strong><small>FIELD SERVICE OPERATIONS / DUBAI</small></span></a><div class="side-label">WORKSPACE</div><nav class="side-nav">${nav.map(([h,n])=>`<a class="${active===n?'active':''}" href="${h}">${n}</a>`).join('')}</nav><div class="side-label">ACCOUNT</div><nav class="side-nav"><a href="#customer">Customer portal</a><a href="#technician">Technician portal</a><a href="#">Public site</a></nav></aside><main class="shell-main">${content}</main></div>`}
function toggleMenu(){document.querySelector(".nav-links")?.classList.toggle("open")}function toggleTheme(){document.body.classList.toggle("dark-mode");localStorage.setItem("gts-theme",document.body.classList.contains("dark-mode")?"dark":"light");const b=document.querySelector(".theme-fab");if(b)b.textContent=document.body.classList.contains("dark-mode")?"☀":"☾"}function restoreTheme(){if(localStorage.getItem("gts-theme")==="dark")document.body.classList.add("dark-mode")}function publicNav(){return `<header class="public-nav"><a class="brand" href="#"><span class="brand-mark">➤</span><span><strong>GULF TECH SERVICES</strong><small>FIELD SERVICE OPERATIONS / DUBAI</small></span></a><nav class="nav-links"><a href="#services">Services</a><a href="#track">Track a job</a><a href="#customer">Customer portal</a><a href="#technician">Technician portal</a></nav><a class="btn small nav-cta" href="#request">Request service ↗</a><button class="menu-toggle" aria-label="Open navigation" onclick="toggleMenu()">☰</button></header>`}
function home(){return publicNav()+`<section class="hero"><div class="hero-copy"><span class="eyebrow light">DUBAI / FIELD OPERATIONS</span><h1>Reliable service.<br><em>Right when you need it.</em></h1><p>One dependable crew for AC, plumbing, electrical and the everyday repairs that keep Dubai homes and businesses moving.</p><div class="hero-actions"><a class="btn amber" href="#request">Request a technician ↗</a><a class="btn outline" style="color:#fff;border-color:#ffffff55" href="#track">◌ Track a job</a></div></div><div class="hero-image"><div class="hero-person"></div></div></section><div class="feature-strip"><div><span>♧</span>Licensed technicians<small>Verified and equipped</small></div><div><span>ϟ</span>Fast response windows<small>Clear arrival expectations</small></div><div><span>▣</span>Transparent AED quotes<small>Approve before work begins</small></div><div><span>◌</span>WhatsApp-first updates<small>Stay in the loop</small></div></div><main class="main"><div class="section-head"><div><span class="eyebrow">THE SERVICE DESK</span><h2>Less chasing.<br>More fixing.</h2></div><p>From a leaking mixer to a villa that needs a proper maintenance rhythm, send the problem once and we’ll route the rest.</p></div><div class="grid">${services.slice(0,3).map(serviceCard).join('')}</div><div class="dark-callout"><div><span class="eyebrow light">NEED A TECHNICIAN?</span><h2>Send the problem.<br><em>We’ll route the rest.</em></h2></div><a class="btn amber" href="#request">Request a technician ↗</a></div></main>`}
function serviceCard(s){return `<a class="service-card" href="#request"><div class="service-glyph ${s[3]}" style="background-image:linear-gradient(180deg,rgba(23,33,31,.02),rgba(23,33,31,.38)),url('${serviceImages[s[4]]}')"></div><div class="service-body"><span class="eyebrow">SCOPE / DUBAI</span><h3>${s[0]}</h3><p>${s[1]}</p><span class="text-link">View service scope ↗</span></div></a>`}
function request(){return publicNav()+`<main class="main"><div class="page-title"><span class="eyebrow">REQUEST / NEW SERVICE</span><h1>Tell us what needs<br><em>attention.</em></h1><p>A few useful details help us arrive prepared. You’ll get a named technician and a clear next step.</p></div><div class="request-layout" style="margin-top:45px"><div class="stepper"><div class="active">01 · Problem</div><div>02 · Location</div><div>03 · Schedule</div><div>04 · Confirm</div></div><div class="form-card"><span class="eyebrow">STEP 01 OF 04</span><h2>What can we help with?</h2><p>Choose the closest match. You can add the detail that matters next.</p><div class="choices">${services.map((s,i)=>`<button class="choice" onclick="selectChoice(this)"><b>${s[2]} &nbsp; ${s[0]}</b><span>${i===0?'Warm air, leaks or noise':i===1?'Leaks, blockages or pressure':'A dependable crew for the work'}</span></button>`).join('')}</div><div class="field"><label>Anything else we should know?</label><textarea id="requestNote" placeholder="For example: AC running but living room is not cooling."></textarea></div><div class="actions"><button class="btn amber" onclick="submitRequest()">Continue to location →</button></div></div></div></main>`}
function selectChoice(el){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');toast('Service type selected')}
function submitRequest(){const note=document.getElementById('requestNote').value.trim();if(!document.querySelector('.choice.selected'))return toast('Choose a service type first');toast('Request saved — location is next');setTimeout(()=>go('#track'),500)}
function track(){return publicNav()+`<main class="main"><div class="page-title"><span class="eyebrow">TRACKING / TS-1042</span><h1>Ahmed is on the way<br><em>to Jumeirah 2.</em></h1><p>Estimated arrival in 18 minutes. Your technician will call on arrival.</p></div><div class="record-grid" style="margin-top:30px"><section class="record"><span class="pill amber">● En route</span><h2>AC repair & service</h2><p>Villa 18, Jumeirah 2 · Today, 10:30 – 11:30</p><div class="loading" style="min-height:90px"><div class="loader"></div><span>Live dispatch signal · updated just now</span></div><div class="actions"><a class="btn" href="#customer">Open customer portal</a></div></section><section class="record"><span class="eyebrow">TECHNICIAN</span><h2>Ahmed Hassan</h2><p>Senior AC Technician · 5.0 rating</p><span class="pill teal">WhatsApp updates active</span></section></div></main>`}
function portal(active='Overview',content=''){return shell(`<div class="topbar"><div><span class="eyebrow">CUSTOMER PORTAL / SARAH AHMED</span><h1>${active}</h1></div><div class="pill amber">Sarah Ahmed</div></div>${content}`,active)}
function chatPanel(){const saved=JSON.parse(localStorage.getItem("gts-chat")||"null")||[{from:"tech",text:"Hi Sarah — I’m on the way. I should be with you in about 18 minutes."},{from:"me",text:"Thanks Ahmed. The indoor unit is making a clicking sound as well."}];return `<section class="chat-card"><div class="chat-head"><div class="chat-person"><div class="online-avatar">AH</div><div class="online-copy"><strong>Chat with Ahmed Hassan</strong><small><span class="pill teal">● Live</span> Technician for TS-1042</small></div></div><span class="eyebrow">SECURE THREAD</span></div><div id="chatMessages" class="chat-messages">${saved.map(m=>`<div class="chat-bubble ${m.from==='me'?'me':''}">${m.text}<small>${m.from==='me'?'You':'Ahmed'} · now</small></div>`).join('')}</div><div id="chatTyping" class="chat-typing"></div><form class="chat-form" onsubmit="sendChat(event)"><input id="chatInput" aria-label="Message your technician" placeholder="Message Ahmed…" autocomplete="off"><button class="btn amber small" type="submit">Send ↗</button></form></section>`}function sendChat(event){event.preventDefault();const input=document.getElementById("chatInput"),text=input.value.trim();if(!text)return;const saved=JSON.parse(localStorage.getItem("gts-chat")||"null")||[];saved.push({from:"me",text});localStorage.setItem("gts-chat",JSON.stringify(saved));document.getElementById("chatMessages").insertAdjacentHTML("beforeend",`<div class="chat-bubble me">${text}<small>You · now</small></div>`);input.value="";document.getElementById("chatTyping").textContent="Ahmed is typing…";setTimeout(()=>{const reply="Got it — I’ll check that when I arrive.";const next=JSON.parse(localStorage.getItem("gts-chat")||"[]");next.push({from:"tech",text:reply});localStorage.setItem("gts-chat",JSON.stringify(next));document.getElementById("chatTyping").textContent="";document.getElementById("chatMessages").insertAdjacentHTML("beforeend",`<div class="chat-bubble">${reply}<small>Ahmed · now</small></div>`);document.getElementById("chatMessages").scrollTop=99999;toast("New message from Ahmed")},1100)}function customer(){return portal('Overview',`<div class="panel" style="border-left:4px solid var(--amber);margin-bottom:18px"><b>Ahmed is on the way to Jumeirah 2.</b><br><small>Estimated arrival in 18 minutes · AC repair</small><div class="actions"><a class="btn small" href="#track">Track live job ↗</a></div></div>${chatPanel()}<div class="stats"><div class="stat"><span>Active requests</span><strong>01</strong><span class="pill amber">On route</span></div><div class="stat"><span>Upcoming appointments</span><strong>02</strong><span>Next · 24 Aug, 10:30</span></div><div class="stat"><span>Open balance</span><strong>AED 420</strong><span>Invoice INV-1042</span></div><div class="stat"><span>Completed jobs</span><strong>06</strong><span>Since Jan 2025</span></div></div><div class="record" style="margin-top:18px"><div class="panel-head"><div><span class="eyebrow">SERVICE DESK</span><h3>Recent jobs</h3></div><div class="actions"><a class="btn outline small" href="#customer/quote">Quote Q-1042</a><a class="btn outline small" href="#customer/invoice">Invoice INV-1042</a><a class="btn amber small" href="#request">+ New request</a></div></div><div class="table-wrap"><div class="table-head"><span>Job</span><span>Customer / location</span><span>Service</span><span>Technician</span><span>Status</span><span>Value</span></div>${jobs.slice(0,4).map(jobRow).join('')}</div></div>`)}
function jobRow(j){return `<a class="table-row" href="#dashboard/jobs/${j.id}"><span><strong>${j.id}</strong><small>${j.time}</small></span><span><strong>${j.customer}</strong><small>${j.location}</small></span><span>${j.service}</span><span>${j.tech}</span><span><span class="pill ${j.key==='completed'?'teal':j.key==='unassigned'?'red':j.key==='enroute'?'amber':''}">${j.status}</span></span><span>AED ${j.value.toLocaleString()}</span></a>`}
function quote(){return portal('Quote Q-1042',`<a class="text-link" href="#customer">← Back to overview</a><div class="record" style="margin-top:24px"><div class="panel-head"><div><span class="eyebrow">QUOTE / Q-1042</span><h2>AC repair & service</h2><p>Prepared for Sarah Ahmed · 24 Aug 2026</p></div><span class="pill amber">Sent for approval</span></div>${[['AC diagnostic and pressure test',120],['Deep clean indoor unit + filters',180],['Drain line flush & materials',75]].map(x=>`<div class="quote-line"><span>${x[0]}</span><b>AED ${x[1]}</b></div>`).join('')}<div class="total"><span>Total</span><b>AED 393.75</b></div><div class="actions"><button class="btn outline small" onclick="downloadPdf('quote')">⇩ Download quote PDF</button><button class="btn amber small" onclick="toast('Quote approved — operations board updated')">Approve quote ✓</button></div></div>`)}
function invoice(){return portal('Invoice INV-1042',`<a class="text-link" href="#customer">← Back to overview</a><div class="record" style="margin-top:24px;background:#fffdf8"><div class="panel-head"><div><span class="eyebrow">INVOICE / INV-1042</span><h2>GULF TECH SERVICES</h2><p>Issued to Sarah Ahmed · 24 Aug 2026</p></div><span class="pill amber">Payment pending</span></div><div class="invoice-line"><span>AC repair & service · TS-1042</span><b>AED 375.00</b></div><div class="invoice-line"><span>VAT 5%</span><b>AED 18.75</b></div><div class="total"><span>Total due</span><b>AED 393.75</b></div><div class="actions"><button class="btn outline small" onclick="downloadPdf('invoice')">⇩ Download invoice PDF</button><button class="btn amber small" onclick="toast('Payment simulated — invoice marked paid')">Pay invoice · AED 393.75</button></div></div>`)}
function dashboardOverview(){return shell(`<div class="topbar"><div><span class="eyebrow">OPS / LIVE BOARD</span><h1>Monday, 24 August 2026</h1></div><div class="actions"><a class="btn outline small" href="#customer/quote">Quote Q-1042</a><a class="btn outline small" href="#customer/invoice">Invoice INV-1042</a><a class="btn amber small" href="#request">+ New request</a></div></div><div class="stats"><div class="stat"><span>New requests</span><strong>12</strong><span>↗ 18% vs last Monday</span></div><div class="stat"><span>Unassigned</span><strong>04</strong><span class="pill red">Needs attention</span></div><div class="stat"><span>In progress</span><strong>05</strong><span>3 technicians active</span></div><div class="stat"><span>Awaiting payment</span><strong>02</strong><span>AED 813 outstanding</span></div></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><span class="eyebrow">LIVE JOBS / 06</span><h3>What’s moving now</h3></div><a class="text-link" href="#dashboard/jobs">View all jobs →</a></div><div class="table-wrap"><div class="table-head"><span>Job</span><span>Customer / location</span><span>Service</span><span>Technician</span><span>Status</span><span>Value</span></div>${jobs.slice(0,5).map(jobRow).join('')}</div></section><section class="panel"><div class="panel-head"><div><span class="eyebrow">DISPATCH PULSE</span><h3>Team on the road</h3></div><span>⌖</span></div><div class="dispatch-map"><i class="pin p1">AH</i><i class="pin p2">RK</i><i class="pin p3">OF</i></div><div><b>Ahmed Hassan</b><br><small>Jumeirah · En route</small></div></section></div>`,'Overview')}
function jobsPage(){return shell(`<div class="topbar"><div><span class="eyebrow">JOBS / ALL REQUESTS</span><h1>Jobs</h1></div><a class="btn amber small" href="#request">+ New job</a></div><div id="jobPage"></div>`,'Jobs')}
function renderJobs(){const root=document.getElementById('jobPage');root.innerHTML=`<div class="toolbar"><input id="q" placeholder="Search jobs, customers or locations"><select id="status"><option value="all">All statuses</option><option value="enroute">En route</option><option value="progress">In progress</option><option value="assigned">Assigned</option><option value="unassigned">Needs assignment</option><option value="completed">Completed</option></select><select id="tech"><option value="all">All technicians</option>${[...new Set(jobs.map(j=>j.tech))].map(t=>`<option>${t}</option>`).join('')}</select><select id="date"><option value="all">All dates</option><option value="2026-08-24">Today · 24 Aug</option><option value="2026-08-23">Yesterday · 23 Aug</option><option value="2026-08-22">22 Aug</option></select><select id="sort"><option value="date-desc">Newest first</option><option value="date-asc">Oldest first</option><option value="status">Status A–Z</option><option value="technician">Technician A–Z</option><option value="value">Highest value</option></select></div><div class="panel"><div class="table-summary"><span id="count"></span><span id="organized"></span></div><div id="jobTable"></div></div>`;['q','status','tech','date','sort'].forEach(id=>document.getElementById(id).addEventListener('input',filterJobs));filterJobs()}
function filterJobs(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value,t=document.getElementById('tech').value,d=document.getElementById('date').value,o=document.getElementById('sort').value;const table=document.getElementById('jobTable');table.innerHTML='<div class="loading"><div class="loader"></div><span>Updating the dispatch view…</span></div>';setTimeout(()=>{let list=jobs.filter(j=>(j.id+' '+j.customer+' '+j.location+' '+j.service+' '+j.tech).toLowerCase().includes(q)&& (s==='all'||j.key===s)&&(t==='all'||j.tech===t)&&(d==='all'||j.date===d));list.sort((a,b)=>o==='value'?b.value-a.value:o==='status'?a.status.localeCompare(b.status):o==='technician'?a.tech.localeCompare(b.tech):o==='date-asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));document.getElementById('count').textContent=list.length+' matching request'+(list.length===1?'':'s');document.getElementById('organized').textContent='Organized by '+({value:'job value',status:'status',technician:'technician','date-asc':'oldest date','date-desc':'newest date'}[o]);document.getElementById('jobTable').innerHTML='<div class="table-wrap"><div class="table-head"><span>Job</span><span>Customer / location</span><span>Service</span><span>Technician</span><span>Status</span><span>Value</span></div>'+list.map(jobRow).join('')+'</div>'},350)}
function technician(){return shell(`<div class="topbar"><div><span class="eyebrow">FIELD APP / AHMED HASSAN</span><h1>Good morning, Ahmed.</h1></div><span class="pill teal">● On duty</span></div><div class="stats"><div class="stat"><span>Today’s jobs</span><strong>04</strong></div><div class="stat"><span>Completed</span><strong>02</strong></div><div class="stat"><span>Next ETA</span><strong>18m</strong></div><div class="stat"><span>Zone</span><strong>Jumeirah</strong></div></div><section class="panel"><span class="eyebrow">TODAY’S ROUTE</span><h3>TS-1042 is your next job.</h3><p>Leave by 10:10 to arrive inside the customer window.</p>${jobs.slice(0,4).map(j=>`<a class="table-row" style="display:grid" href="#technician"><span><strong>${j.time.split(' ')[0]}</strong><small>${j.id}</small></span><span><strong>${j.service}</strong><small>${j.customer} · ${j.location}</small></span><span><span class="pill ${j.key==='completed'?'teal':j.key==='enroute'?'amber':''}">${j.status}</span></span></a>`).join('')}</section>`,'Technicians')}
function pdfEsc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}function downloadPdf(kind){const quote=kind==='quote',title=quote?'GULF TECH SERVICES - QUOTE Q-1042':'GULF TECH SERVICES - INVOICE INV-1042',lines=quote?['Prepared for Sarah Ahmed','AC repair & service','AC diagnostic and pressure test                 AED 120.00','Deep clean indoor unit + filters               AED 180.00','Drain line flush & materials                    AED 75.00','VAT (5%)                                       AED 18.75','TOTAL                                          AED 393.75','Valid until: 31 Aug 2026']:['Issued to Sarah Ahmed','AC repair & service - TS-1042','Service date: 24 Aug 2026','Subtotal                                        AED 375.00','VAT (5%)                                       AED 18.75','TOTAL DUE                                      AED 393.75','Payment due: On completion'];const stream=['BT /F1 18 Tf 50 760 Td',`(${pdfEsc(title)}) Tj`,'0 -28 Td','(Dubai - Field Service Operations) Tj',...lines.map(x=>`0 -22 Td (${pdfEsc(x)}) Tj`),'ET'].join('\n');const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];let pdf='%PDF-1.4\n',off=[0];objs.forEach((o,i)=>{off.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const x=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n${off.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n ').join('\n')}\ntrailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));a.download=quote?'GTS-Quote-Q-1042.pdf':'GTS-Invoice-INV-1042.pdf';a.click();toast('PDF downloaded to your device')}
function render(){const h=location.hash||'#home',path=h.slice(1);let html=path==='home'||path===''?home():path==='services'?publicNav()+`<main class="main"><div class="page-title"><span class="eyebrow">SERVICES / DUBAI</span><h1>One crew for the work<br><em>you don’t want to chase.</em></h1></div><div class="grid" style="margin-top:35px">${services.map(serviceCard).join('')}</div></main>`:path==='request'?request():path==='track'?track():path==='customer'?customer():path==='customer/quote'?quote():path==='customer/invoice'?invoice():path==='dashboard'?dashboardOverview():path==='dashboard/jobs'?jobsPage():path==='technician'?technician():home();document.getElementById('app').innerHTML=html;if(!document.querySelector(".theme-fab")){document.body.insertAdjacentHTML("beforeend","<button class=\"theme-fab\" aria-label=\"Toggle dark mode\" onclick=\"toggleTheme()\">☾</button>")}restoreTheme();const themeButton=document.querySelector(".theme-fab");if(themeButton)themeButton.textContent=document.body.classList.contains("dark-mode")?"☀":"☾";if(path==='dashboard/jobs')renderJobs()}window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
